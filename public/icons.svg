<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0d1527" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
  </defs>

  <!-- Fundo do Card -->
  <rect width="100" height="100" rx="24" fill="url(#bgGrad)" stroke="#2563eb" stroke-opacity="0.3" stroke-width="2"/>

  <!-- Barra de Som 1 (Esquerda Baixa) -->
  <rect x="20" y="44" width="7" height="24" rx="3.5" fill="#3b82f6" />

  <!-- Barra de Som 2 (Esquerda Média) -->
  <rect x="33" y="34" width="7" height="42" rx="3.5" fill="#3b82f6" />

  <!-- Cruz Central (Louvor) -->
  <rect x="46.5" y="20" width="7" height="60" rx="3.5" fill="#ffffff" />
  <rect x="37" y="35" width="26" height="7" rx="3.5" fill="#ffffff" />

  <!-- Barra de Som 3 (Direita Média) -->
  <rect x="60" y="34" width="7" height="42" rx="3.5" fill="#3b82f6" />

  <!-- Barra de Som 4 (Direita Baixa) -->
  <rect x="73" y="44" width="7" height="24" rx="3.5" fill="#3b82f6" />
</svg>
